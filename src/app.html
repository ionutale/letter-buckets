<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- A game, not a document: pinch and double-tap zoom only ever fight the
		     tiles. iOS ignores user-scalable=no, so the guards below cover it. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<script>
			// Safari on iOS has ignored user-scalable=no since iOS 10. Gesture
			// events are the only reliable way to stop a pinch there.
			for (const type of ['gesturestart', 'gesturechange', 'gestureend']) {
				document.addEventListener(type, (event) => event.preventDefault(), {
					passive: false
				});
			}
		</script>
		<meta name="theme-color" content="#fdf6e9" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<title>Letter Buckets</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
